<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Patient Management System</title>
    <style type="">
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .landing-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 50px 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        .landing-card h1 {
            color: #1a3c5e;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .landing-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .jsf-btn {
            padding: 14px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-primary {
            background: #00b09b;
            color: white;
        }
        .btn-primary:hover {
            background: #009688;
        }
        .btn-secondary {
            background: #f1f1f1;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
    </style>
</h:head>
<h:body>
    <f:view>
        <div class="landing-card">
            <h1>Patient Management System</h1>
            <p>Register, view, and manage patient records with ease.</p>
            <div class="btn-group">
                <h:form>
                    <h:commandButton styleClass="jsf-btn btn-primary"
                                     value="Register New Patient"
                                     action="patientRegistration?faces-redirect=true"/>
                    <br/><br/>
                    <h:commandButton styleClass="jsf-btn btn-secondary"
                                     value="View All Patients"
                                     action="patientList?faces-redirect=true"/>
                </h:form>
            </div>
        </div>
    </f:view>
</h:body>
</html>
